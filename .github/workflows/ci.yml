name: CPU delivery contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-delivery-windows.lock
      - name: Install verified Windows CPU wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-delivery-windows.lock
      - name: Check dependency closure
        run: python -m pip check
      - name: Run all synthetic and contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate data-independent reproduction plan
        run: python -m newsforge.delivery.pipeline plan --output artifacts/delivery/ci_plan.json
      - name: Preserve planned stage graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-plan
          path: artifacts/delivery/ci_plan.json
          if-no-files-found: ignore
